version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
    # Give newly published versions time to be vetted before auto-bumping.
    # (Dependabot cannot enforce a minimum age; review PRs before merging.)

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
